name: nexus

services:
  api:
    build: ./backend
    container_name: nexus-api
    restart: unless-stopped
    ports:
      - "8000:8000"
    env_file:
      - ./backend/.env
    volumes:
      - ./backend/data:/app/data
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import sys,urllib.request; sys.exit(0 if urllib.request.urlopen('http://localhost:8000/health').status==200 else 1)",
        ]
      interval: 30s
      timeout: 5s
      retries: 3

  web:
    build: ./frontend
    container_name: nexus-web
    restart: unless-stopped
    depends_on:
      - api
    ports:
      - "3000:3000"
    environment:
      - NEXT_PUBLIC_API_URL=http://localhost:8000

  ollama:
    image: ollama/ollama:latest
    container_name: nexus-ollama
    profiles: ["local-models"]
    restart: unless-stopped
    ports:
      - "11434:11434"
    volumes:
      - ./backend/data/ollama:/root/.ollama