[project]
name = "aiverse-api"
version = "0.1.0"
description = "AIverse - self-hosted AI-content detection and humanization toolkit"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "faiss-cpu>=1.15.0",
    "fastapi>=0.141.1",
    "httpx>=0.28.1",
    "langchain>=1.3.15",
    "langchain-anthropic>=1.5.6",
    "langchain-community>=0.4.2",
    "langchain-core>=1.5.5",
    "langchain-google-genai>=4.3.4",
    "langchain-ollama>=1.1.0",
    "langchain-openai>=1.5.1",
    "langchain-text-splitters>=1.1.2",
    "langgraph>=1.2.11",
    "openai>=3.0.0",
    "pydantic-settings>=2.15.0",
    "pypdf>=6.16.1",
    "python-docx>=1.2.0",
    "python-multipart>=0.0.32",
    "reportlab>=4.5.0",
    "structlog>=26.1.0",
    "uvicorn[standard]>=0.52.3",
]

[dependency-groups]
dev = [
    "mypy>=2.3.0",
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
    "ruff>=0.16.3",
]

[tool.uv]
package = false

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
ignore = ["B008"]  # Depends() in defaults is the canonical FastAPI DI pattern

[tool.mypy]
strict = true
python_version = "3.12"
mypy_path = ["src"]
plugins = ["pydantic.mypy"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
pythonpath = ["src", "tests"]
markers = ["smoke: live-network tests (skipped by default)"]
